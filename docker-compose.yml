services:
  postgres:
    image: postgres:16-alpine
    container_name: allchrono-postgres
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER:-allchrono}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-allchrono_dev}
      POSTGRES_DB: ${DATABASE_NAME:-allchrono}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-allchrono} -d ${DATABASE_NAME:-allchrono}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
